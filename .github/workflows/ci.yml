name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.25.5', '1.23.1', '1.22.7', '1.21.13']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Get dependencies
        run: go get -v github.com/zquestz/ws-tcp-proxy

      - name: Build
        run: go build

      - name: Format check
        run: go fmt ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          go test -i -race ./...
          go test -v -race ./...

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install release tools
        run: |
          go install github.com/inconshreveable/mousetrap@latest
          go install github.com/mitchellh/gox@latest
          go install github.com/tcnksm/ghr@latest

      - name: Cross-compile
        run: make compile

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ghr --username zquestz --token $GITHUB_TOKEN --replace ${{ github.ref_name }} pkg/